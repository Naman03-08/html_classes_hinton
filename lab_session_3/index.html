<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="form_input_for_data">
    <h1 style=" margin-left: 50px; ">Enter your Data to proceed</h1>

    <form action="">
        <label for="first_name" style="margin-left: 100px; ">first name:</label >
        <input type="text" placeholder="enter your first name"  name="first_name">
        <br>
        <br>
        <label for="last_name" style="margin-left: 100px;">Last name </label class="form">
        <input type="text" placeholder="enter your last name "  name="last_name">
        <br>
        <br>
        <label for="email" style="margin-left: 100px;">Email id: </label class="form">
        <input type="email" placeholder="abcdefgh@gmail.com" class="form" name="email" style="width: 200px;">
        <br><br>
        <label style="margin-left: 100px;">password: </label class="form" > 
        <input type="password" placeholder="enter your password" class="form" maxlength="10" minlength="6">
        <br><br>
        <label style="margin-left: 100px;">Phone number: </label class="form">
        <input type="number" placeholder="enter your number"  class="form" minlength="10" maxlength="10" >
    </form>
    <br>
    <button onclick="alert('form submitted!!!!')" style="margin-left: 200px; padding: auto;" type="submit">submit</button>
    <button type="reset" onclick="alert('for reset!!!!')">Reset</button>
    </div>
</body>
</html>
