<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram login page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

</head>
<body>
<div id="main_body">
    <header>
      <select name="" id="Language_select_box">
        <option value="English">English</option>
        <option value="hindi">Hindi</option>
        <option value="Arabic">Arabic</option>
        <option value="Urdu">Urdu</option>
        <option value="French">French</option>
        <option value="German">german</option>
        <option value="Polish">Polish</option>
      </select>
    </header>
    
    <main id="main">
      <span id="Instagram_name">Instagram</span>
    </main>

    <main id="Facebook_login_button_main">
        <button id="Facebook_login_button"><a href="#" id="continue_with_fb"> <i class="fa-brands fa-facebook-f fa-xl" style="color: white;"> &nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </i> Continue With FaceBook</a></button>

        <div class="or-divider">
             <span class="or-text">OR</span>
        </div>

     <div>
         <input type="text" placeholder="phone number, username or email address" class="phone_number_input_for_login">
         <br>
         <input type="password" placeholder="password" class="phone_number_input_for_login">
         <br>
         <div id="forgot_password_section"><a href="#" id="forgot_password">Forget passowrd?</a></div>
         <br>
        
     </div>
    </main>

    <main>
         <button id="Login_button">
            <a href="#" id="login"> Log in</a>
        </button>
    </main>
<br>
    <main>
        <span id="Sign_up_page"> Don't have an account? <a href="#" id="Sign_up">Sign up</a> </span>
    </main>

    <footer>
    <div id="From_last_ine">FROM</div>
    <div id="Facebook_name_footer">FACEBOOK</div>
    </footer>

</div>
</body>
</html>
